# AutoEQ Studio's tests on GitHub's Windows machine, for every push to main and every pull request: the same command
# as on the PC (app\tools\selftest.py runs the tests in tests\, each part in its own process). Tests that need what
# this machine lacks (a desktop for the hotkey, Windows' text reader, Claude's notes) skip and say why.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:\Windows\Fonts
      PYTHONIOENCODING: utf-8
      PYTHONFAULTHANDLER: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      AUTOEQSTUDIO_MAX_WORKERS: "2"
      AUTOEQSTUDIO_TIME_FACTOR: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt
      - name: Python environment (.venv, as setup.bat makes it)
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --disable-pip-version-check -r app\requirements.txt -r app\requirements-dev.txt
      - name: Tests
        shell: pwsh
        run: .venv\Scripts\python.exe app\tools\selftest.py --out test-output
      - name: Test logs, when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: test-output
          retention-days: 7
