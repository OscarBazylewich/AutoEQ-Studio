# AutoEQ Studio's tests (the tests folder). All of them, each part in its own process:
#     ".venv\Scripts\python.exe" app\tools\selftest.py [--quick]
# the ones a change needs:   ".venv\Scripts\python.exe" app\tools\relevant_tests.py --run
# one file:                  ".venv\Scripts\python.exe" -m pytest tests\<part>\test_<name>.py
# tests\conftest.py puts every test on temporary folders: never your files, the real Equalizer APO folder, AppData,
# the registry or the internet.
[pytest]
minversion = 9.1
required_plugins = pytest-timeout>=2.4.0
testpaths = tests
pythonpath = tests app/tools
addopts = -p no:cacheprovider --import-mode=importlib --strict-markers --strict-config -ra
python_files = test_*.py
timeout = 300
timeout_method = thread
xfail_strict = true
markers =
    slow: opens Make an EQ or runs Best fit's worker pools for long (selftest.py --quick leaves these out, as the old --quick left out the EQ part)
    allow_strays(reason): this test may show a control as a window of its own (the reason says why)
